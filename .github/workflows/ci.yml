name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke-test:
    name: build + clippy + QEMU boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-unknown-none + clippy + llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-none
          rustup component add clippy rustfmt llvm-tools-preview

      - name: Install QEMU + FAT tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm mtools dosfstools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --target aarch64-unknown-none -- -D warnings

      - name: Build (debug)
        run: cargo build

      - name: Build (release)
        run: cargo build --release

      - name: QEMU boot smoke-test (debug)
        run: ./ci/smoke-test.sh target/aarch64-unknown-none/debug/kernel

      - name: QEMU boot smoke-test (release)
        run: ./ci/smoke-test.sh target/aarch64-unknown-none/release/kernel

      # Hypervisor (EL2) boot test. Needs QEMU >= 8 for TCG stage-2; ubuntu's
      # apt qemu-system-arm is 8.x, so hyp-smoke-test.sh runs it natively (its
      # host-qemu>=8 branch). It SKIPs cleanly if the runner's QEMU is too old.
      # First run: no Image staged -> the slot runs the M10 bring-up stub.
      - name: QEMU hypervisor (EL2) smoke-test — stub fallback
        run: ./ci/hyp-smoke-test.sh target/aarch64-unknown-none/debug/kernel

      # Second run: stage the in-tree synthetic arm64 Image so the Image-detect
      # + arm64-boot-protocol entry path (M11-M13) is exercised end-to-end.
      - name: QEMU hypervisor (EL2) smoke-test — staged Image boot
        run: STAGE_SYNTH_IMAGE=1 ./ci/hyp-smoke-test.sh target/aarch64-unknown-none/debug/kernel
