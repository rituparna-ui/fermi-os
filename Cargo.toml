[package]
name = "fermi"
version = "0.1.0"
edition = "2021"
description = "Fermi OS - a bare-metal aarch64 kernel in pure Rust + assembly"

[[bin]]
name = "kernel"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 1
overflow-checks = false

[profile.release]
panic = "abort"
lto = true
opt-level = 2
